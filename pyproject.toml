[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metaphaser"
version = "0.2.0rc3"
description = "Link metagenomic junction states and nanopore DNA modification calls"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Andrey Eremin"}]
dependencies = ["pysam>=0.22", "edlib>=1.3.9", "numpy>=1.26", "rich>=13", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
metaphaser = "metaphaser.cli:main"

[project.urls]
Homepage = "https://github.com/andreyeremin/metaphaser"
Documentation = "https://github.com/andreyeremin/metaphaser#readme"
Issues = "https://github.com/andreyeremin/metaphaser/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: small end-to-end test using minimap2"]
