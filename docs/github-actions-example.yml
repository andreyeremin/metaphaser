name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Build minimap2 2.30
        run: |
          git clone --depth 1 --branch v2.30 https://github.com/lh3/minimap2.git "$RUNNER_TEMP/minimap2"
          make -C "$RUNNER_TEMP/minimap2" -j2
          echo "$RUNNER_TEMP/minimap2" >> "$GITHUB_PATH"
      - name: Install and build
        run: |
          python -m pip install -r requirements-tested.txt
          python -m build --no-isolation
          python -m pip install --no-deps dist/*.whl
          metaphaser doctor
      - name: Run regression tests
        run: python -m pytest -q
